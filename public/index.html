<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <!-- ========================================
       CONFIGURAÇÕES BÁSICAS DA PÁGINA
       ======================================== -->

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Planejamento Semanal
  </title>


  <!-- ========================================
       ARQUIVO DE ESTILO
       ======================================== -->

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <!-- ========================================
       TELA DE LOGIN
       ======================================== -->

  <section id="login-screen">

    <div class="login-card">


      <!-- ========================================
           TÍTULO DO LOGIN
           ======================================== -->

      <h2>
        Planejamento Semanal
      </h2>

      <p class="login-subtitle">
        Entre com seu usuário para acessar o sistema
      </p>


      <!-- ========================================
           CAMPO DE E-MAIL
           ======================================== -->

      <label for="login-email">
        E-mail
      </label>

      <input
        type="email"
        id="login-email"
        placeholder="Digite seu e-mail"
        autocomplete="username"
      >


      <!-- ========================================
           CAMPO DE SENHA
           ======================================== -->

      <label for="login-senha">
        Senha
      </label>

      <input
        type="password"
        id="login-senha"
        placeholder="Digite sua senha"
        autocomplete="current-password"
      >


      <!-- ========================================
           BOTÃO ENTRAR
           ======================================== -->

      <button
        type="button"
        id="btn-login"
      >
        Entrar
      </button>


      <!-- ========================================
           MENSAGEM DO LOGIN
           ======================================== -->

      <div
        id="login-msg"
        aria-live="polite"
      ></div>


    </div>

  </section>


  <!-- ========================================
       SISTEMA PRINCIPAL
       ======================================== -->

  <div id="app-screen">


    <!-- ========================================
         CABEÇALHO DO PLANEJAMENTO
         ======================================== -->

    <header class="top">


      <!-- ========================================
           DADOS DA PROFESSORA / TURMA
           ======================================== -->

      <div class="planner-info">


        <!-- ========================================
             PROFESSORA
             ======================================== -->

        <div class="info-row">

          <label for="professora">
            Professora:
          </label>

          <input
            type="text"
            id="professora"
            placeholder="Nome da professora"
          >

        </div>


        <!-- ========================================
             TURMA
             ======================================== -->

        <div class="info-row">

          <label for="turma">
            Turma:
          </label>

          <input
            type="text"
            id="turma"
            placeholder="Ex.: Infantil II B"
          >

        </div>


        <!-- ========================================
             PERÍODO
             ======================================== -->

        <div class="info-row periodo-row">

          <span class="info-label">
            Período:
          </span>


          <!-- MANHÃ -->

          <label class="periodo-option">

            <input
              type="radio"
              name="periodo"
              value="Manhã"
              id="periodo-manha"
            >

            Manhã

          </label>


          <!-- TARDE -->

          <label class="periodo-option">

            <input
              type="radio"
              name="periodo"
              value="Tarde"
              id="periodo-tarde"
            >

            Tarde

          </label>

        </div>


        <!-- ========================================
             ESCOLA
             ======================================== -->

        <div class="info-row escola-row">

          <span class="info-label">
            Escola:
          </span>

          <strong>
            EMEI Viriato Correia
          </strong>

        </div>


      </div>


      <!-- ========================================
           TÍTULO / STATUS / USUÁRIO
           ======================================== -->

      <div class="top-row">


        <!-- ========================================
             TÍTULO DO SISTEMA
             ======================================== -->

        <h1>
          Planejamento
          <span>Semanal</span>
        </h1>


        <!-- ========================================
             ÁREA DO USUÁRIO LOGADO
             ======================================== -->

        <div class="user-area">


          <!-- ========================================
               STATUS DE SALVAMENTO
               ======================================== -->

          <div class="save-status">

            <span
              class="dot"
              id="saveDot"
            ></span>

            <span id="saveText">
              salvo
            </span>

          </div>


          <!-- ========================================
               NOME / PERFIL DO USUÁRIO
               ======================================== -->

          <span id="usuario-logado"></span>


          <!-- ========================================
               BOTÃO SAIR
               ======================================== -->

          <button
            type="button"
            class="ctrl"
            id="btn-logout"
          >
            Sair
          </button>


        </div>

      </div>


      <!-- ========================================
           NAVEGAÇÃO ENTRE SEMANAS
           ======================================== -->

      <div
        class="top-row"
        style="margin-top:12px;"
      >


        <!-- ========================================
             CONTROLES DE SEMANA
             ======================================== -->

        <div class="week-nav">

          <button
            class="ctrl"
            id="prevWeek"
          >
            ◀ semana
          </button>


          <input
            type="week"
            id="weekPicker"
          >


          <button
            class="ctrl"
            id="nextWeek"
          >
            semana ▶
          </button>


          <span
            class="range-label"
            id="rangeLabel"
          ></span>

        </div>


        <!-- ========================================
             AÇÕES DA SEMANA
             ======================================== -->

        <div class="week-nav">


          <!-- COPIAR SEMANA -->

          <button
            class="ctrl"
            id="duplicateBtn"
          >
            Copiar semana anterior
          </button>


          <!-- IMPRIMIR -->

          <button
            class="ctrl primary"
            id="printBtn"
          >
            Imprimir
          </button>


        </div>

      </div>


    </header>


    <!-- ========================================
         ÁREA DOS DIAS DA SEMANA
         ======================================== -->

    <main id="daysContainer">

      <!--
        Segunda, terça, quarta, quinta e sexta
        são criadas automaticamente pelo script.js
      -->

    </main>


    <!-- ========================================
         RODAPÉ
         ======================================== -->

    <footer>

      As opções de local/atividade digitadas
      ficam salvas para sugestão nas próximas semanas.

    </footer>


  </div>
  <!-- FIM DO SISTEMA PRINCIPAL -->


  <!-- ========================================
       JAVASCRIPT
       ======================================== -->

  <script src="script.js"></script>


</body>

</html>
